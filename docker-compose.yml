# ============================================================
# Micro Business Suite — Docker Compose (Next.js app + Neon PostgreSQL)
#
# วิธีใช้:
#   cp .env.example .env.local
#   # ตั้ง DATABASE_URL เป็น Neon pooled connection string
#   docker compose --env-file .env.local up -d --build
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbs-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.local to the Neon pooled connection string}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-86400}
      PRODUCT_MODE: ${PRODUCT_MODE:-perpetual}
      LICENSE_SALT: ${LICENSE_SALT}
      MBS_LICENSE_KEY: ${MBS_LICENSE_KEY}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMAIL_FROM: ${GMAIL_FROM:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      CRON_ENABLED: ${CRON_ENABLED:-false}
      RECURRING_SECRET: ${RECURRING_SECRET:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
